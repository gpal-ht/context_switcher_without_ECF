# Context Switcher engineering backend selection.
#
# Values:
#   standalone  - Context Switcher runs without ECF. ECF-only capabilities
#                 report UNSUPPORTED_CAPABILITY instead of executing.
#   ecf         - ECF-integrated mode. Requires a valid, compatible bundled
#                 ECF at vendor/ecf (validated at selection time; an invalid
#                 or missing bundle is a hard configuration failure, never a
#                 silent fallback to standalone).
#
# Resolution order (first match wins):
#   1. CONTEXT_SWITCHER_ENGINEERING_BACKEND environment variable
#   2. this file (engineering_backend key)
#   3. default: standalone
#
# This repository commits `ecf` explicitly because it ships a pinned,
# validated ECF bundle (see release/COMPATIBILITY.md and ADR-0007).
# Unknown values are a validation error in every resolver.
engineering_backend: ecf
