# Canonical, machine-readable Engineering Control Framework version identity.
# This is the ONLY authoritative source of ECF version for tooling (the planner
# reads ECF identity from here, never from README prose).
schema_version: "0.1.0"
component: engineering_control_framework
version: v0.1
status: development

# Git commit resolution policy for provenance comparison (conservative v0.1):
#   best_effort - the current commit is resolved via `git rev-parse HEAD` when
#                 available. When the current or recorded commit is unavailable,
#                 the planner falls back to VERSION-ONLY comparison for the
#                 commit dimension (it does not treat an unavailable commit as
#                 stale). When both commits are known and differ, the output is
#                 stale. The `version` field above is always compared.
commit_policy: best_effort
